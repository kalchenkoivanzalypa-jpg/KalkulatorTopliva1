{% extends "base.html" %}
{% block title %}Расчёт — назначение{% endblock %}
{% block content %}
<div class="card">
  <h1>Шаг 2. Пункт назначения</h1>
  <p class="muted">Продукт: <b>{{ product_name }}</b></p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/calc/destination">
    <label for="destination">Населённый пункт, ж/д станция или 6-значный код ЕСР</label>
    <input type="text" name="destination" id="destination" required placeholder="Например: Иркутск"/>
    <p class="muted small">Подробная инструкция по вводу — в разделе <a href="/about">«О сервисе»</a>.</p>
    <div class="actions">
      <button class="btn" type="submit">Найти базисы</button>
      <a class="btn secondary" href="/calc">Назад</a>
    </div>
  </form>
</div>
{% endblock %}
